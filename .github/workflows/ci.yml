name: Snakemake Bioinformatics Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code and the data/ folder from GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python on the cloud runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install Snakemake
    - name: Install Snakemake
      run: |
        python -m pip install --upgrade pip
        pip install snakemake

    # 4. Run the Snakemake pipeline locally in the cloud
    - name: Run Snakemake Workflow
      run: snakemake --cores 1

