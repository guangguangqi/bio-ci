name: Snakemake Bioconda Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code, data, and environment configurations
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up a fast, clean Conda/Mamba system on the cloud server
    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: snakemake-env
        # FIX: We explicitly pin pulp=2.7.0 alongside snakemake to bypass the bug
        create-args: >-
          snakemake
          pulp=2.7.0
          conda-forge::python=3.10
        cache-environment: true

    # 3. Run Snakemake and tell it to use Conda for individual rules
    - name: Run Snakemake Workflow with Conda
      run: |
        snakemake --cores 1 --use-conda

