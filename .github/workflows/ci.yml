name: Snakemake Bioconda Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository files
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python on the cloud runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Setup a clean, official Conda environment for Bioconda packages
    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        channels: bioconda,conda-forge

    # 4. Install Snakemake and fix the PuLP bug via pip
    - name: Install Snakemake and Dependecies
      run: |
        python -m pip install --upgrade pip
        pip install snakemake pulp==2.7.0

    # 5. Execute your pipeline
    - name: Run Snakemake Workflow
      run: |
        snakemake --cores 1 --use-conda

